name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  XCODE_VERSION: "26.0"
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tag format
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3" >&2; exit 1; }
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - run: swift --version
      - name: Install ripgrep
        run: brew install ripgrep
      - name: No networking code
        run: scripts/check-no-network.sh
      - run: make test
      - name: Build Clipjar.zip
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: make zip VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="$RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: Clipjar.zip
          path: build/Clipjar.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Clipjar.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Clipjar.zip --repo "$GITHUB_REPOSITORY" --title "Clipjar $GITHUB_REF_NAME" --generate-notes
