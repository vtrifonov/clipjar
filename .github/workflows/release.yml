name: Release
# Releases from main whenever VERSION in the Makefile names a version that has no tag yet.
# Bump VERSION in a PR; merging it builds Clipjar.zip and publishes vX.Y.Z at the merge commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  XCODE_VERSION: "26.0"
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^VERSION ?= //p' Makefile)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Makefile VERSION must look like 1.2.3, got '$version'" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "v$version is already released; bump VERSION in the Makefile to release again."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - run: swift --version
      - name: Install ripgrep
        run: brew install ripgrep
      - name: No networking code
        run: scripts/check-no-network.sh
      - run: make test
      - name: Build Clipjar.zip
        env:
          VERSION: ${{ needs.check.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: make zip VERSION="$VERSION" BUILD_NUMBER="$RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: Clipjar.zip
          path: build/Clipjar.zip
          if-no-files-found: error
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Clipjar.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.check.outputs.version }}
        run: gh release create "$TAG" Clipjar.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Clipjar $TAG" --generate-notes
